<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176353">
  <meta name="description" content="2026年底雅思口语备考。按题查完整答案，按共用故事减少重复背诵，练习Part 1、Part 2与Part 3。">
  <title>Daily Notes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23176353'/%3E%3Cpath d='M8 9h16v11H15l-5 4v-4H8z' fill='white'/%3E%3Cpath d='M12 13h8M12 16h6' stroke='%23176353' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261008-ui-v2">
</head>
<body>
  <main class="shell" id="app">
    <header class="top" id="site-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">≋</div>
        <div>
          <h1>雅思口语备考</h1>
          <div class="date">12月底 · 迪拜</div>
        </div>
      </div>
      <button class="progress-button" id="progress-open" type="button">进度</button>
    </header>

    <nav class="tabs" role="tablist" aria-label="练习内容">
      <button class="tab" id="tab-p2" role="tab" aria-controls="practice-panel" aria-selected="true" data-view="p2">Part 2</button>
      <button class="tab" id="tab-p1" role="tab" aria-controls="practice-panel" aria-selected="false" data-view="p1" tabindex="-1">Part 1</button>
      <button class="tab" id="tab-p3" role="tab" aria-controls="practice-panel" aria-selected="false" data-view="p3" tabindex="-1">Part 3</button>
      <button class="tab" id="tab-stories" role="tab" aria-controls="practice-panel" aria-selected="false" data-view="stories" tabindex="-1">共用故事</button>
    </nav>

    <section id="practice-panel" role="tabpanel" aria-labelledby="tab-p2">
      <p class="topnote" id="topnote"></p>
      <div class="tools">
        <div class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="搜索中英文题目、问题、关键词或编号" aria-label="搜索中英文题目、问题、关键词或编号" autocomplete="off">
          <button id="clear-search" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
      </div>

      <div class="filters" id="filters" aria-label="题目分类"></div>

      <div class="workspace">
        <section class="listwrap" aria-labelledby="list-title">
          <div class="listhead">
            <h2 id="list-title" tabindex="-1">题库</h2>
            <div class="list-actions">
              <button class="toggle-button" id="only-unlearned" type="button" aria-pressed="false">只看未背</button>
              <button class="toggle-button random-button" id="random" type="button">随机</button>
            </div>
          </div>
          <p class="result-count" id="listcount" aria-live="polite"></p>
          <div id="resume" class="resume" hidden></div>
          <div id="list" class="list"></div>
        </section>

        <article class="reader" id="reader" aria-label="答案阅读区">
          <div class="empty reader-placeholder">选一道题，开始练习。</div>
        </article>
      </div>
    </section>

    <details class="sources" id="sources">
      <summary>题库来源与使用说明</summary>
      <div id="sources-content"></div>
    </details>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="progress-dialog" id="progress-dialog" aria-labelledby="progress-title">
    <div class="dialog-head">
      <div>
        <h2 id="progress-title">本机练习进度</h2>
        <p>保存在当前浏览器，不会自动同步到其他设备。</p>
      </div>
      <button class="icon-button" id="progress-close" type="button" aria-label="关闭进度">×</button>
    </div>
    <div class="progress-grid" id="progress-grid"></div>
    <div class="dialog-actions">
      <button class="btn" id="export-progress" type="button">导出进度</button>
      <button class="btn file-button" id="import-progress-button" type="button">导入进度</button>
      <input id="import-progress" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="import-preview" id="import-preview" hidden></div>
  </dialog>

  <section id="audio-dock" class="audio-dock" aria-label="正文播放器" hidden>
    <div class="audio-compact">
      <button class="audio-main" id="audio-toggle" type="button" aria-label="播放">▶</button>
      <button class="audio-title" id="audio-title" type="button" title="返回正在播放的正文"></button>
      <button class="audio-next-compact" id="audio-next-compact" type="button">下一音频</button>
      <button class="audio-expand" id="audio-expand" type="button" aria-expanded="false" aria-controls="audio-expanded">展开</button>
    </div>
    <div class="audio-expanded" id="audio-expanded" hidden>
      <audio id="audio" controls preload="none" aria-label="英文正文音频"></audio>
      <div class="audio-controls">
        <button class="btn" id="audio-prev" type="button">上一音频</button>
        <button class="btn" id="audio-next" type="button">下一音频</button>
        <label>语速
          <select id="audio-rate" aria-label="播放语速">
            <option value="0.8">0.8倍</option>
            <option value="1">1倍速</option>
            <option value="1.2">1.2倍</option>
            <option value="1.5">1.5倍</option>
          </select>
        </label>
        <label>模式
          <select id="audio-mode" aria-label="播放模式">
            <option value="continuous">连续播放</option>
            <option value="repeat">单篇循环</option>
            <option value="single">单篇播放</option>
          </select>
        </label>
        <button class="btn audio-follow" id="audio-follow" type="button" aria-pressed="true">✓ 跟随正文</button>
        <button class="btn danger-quiet" id="audio-close" type="button">关闭播放器</button>
      </div>
      <p class="audio-context" id="audio-context"></p>
      <div class="audio-status" id="audio-status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <script src="data.js?v=20261008-daniel-160"></script>
  <script src="transcript-sync.js?v=20261008-follow-text"></script>
  <script src="app.js?v=20261008-ui-v1"></script>
</body>
</html>
